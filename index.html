<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Organograma Interativo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app" id="app">
    <!-- ============ TOP BAR ============ -->
    <header class="topbar">
      <button class="icon-btn only-mobile" id="menuBtn" aria-label="Abrir painel">
        <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>

      <div class="brand">
        <div class="logo" aria-hidden="true">
          <svg viewBox="0 0 32 32">
            <rect x="11" y="3" width="10" height="7" rx="2"/>
            <rect x="3" y="22" width="8" height="7" rx="2"/>
            <rect x="12" y="22" width="8" height="7" rx="2"/>
            <rect x="21" y="22" width="8" height="7" rx="2"/>
            <path d="M16 10v6M7 22v-6h18v6M16 16v6"/>
          </svg>
        </div>
        <div class="brand-text">
          <h1>Organograma</h1>
          <p>Estrutura organizacional · Mermaid</p>
        </div>
      </div>

      <nav class="tabs" role="tablist" aria-label="Modo de visualização">
        <span class="tab-indicator" id="tabIndicator"></span>
        <button role="tab" data-mode="vertical" class="tab active" title="Vertical (1)">
          <svg viewBox="0 0 24 24"><rect x="8.5" y="2" width="7" height="5" rx="1.5"/><rect x="2" y="16" width="6" height="5" rx="1.5"/><rect x="9" y="16" width="6" height="5" rx="1.5"/><rect x="16" y="16" width="6" height="5" rx="1.5"/><path d="M12 7v4.5M5 16v-4.5h14V16M12 11.5V16"/></svg>
          <span>Vertical</span>
        </button>
        <button role="tab" data-mode="tree" class="tab" title="Árvore horizontal (2)">
          <svg viewBox="0 0 24 24"><rect x="2" y="9" width="6" height="6" rx="1.5"/><rect x="16" y="3" width="6" height="5" rx="1.5"/><rect x="16" y="16" width="6" height="5" rx="1.5"/><path d="M8 12h4M12 5.5v13M12 5.5h4M12 18.5h4"/></svg>
          <span>Horizontal</span>
        </button>
        <button role="tab" data-mode="radial" class="tab" title="Radial (3)">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="2.5"/><circle cx="12" cy="12" r="6.5" stroke-dasharray="2 2.5"/><circle cx="12" cy="12" r="10.5" stroke-dasharray="2 2.5"/></svg>
          <span>Radial</span>
        </button>
        <button role="tab" data-mode="mermaid" class="tab" title="Mermaid original (4)">
          <svg viewBox="0 0 24 24"><path d="M8 7l-5 5 5 5M16 7l5 5-5 5M13.5 5l-3 14"/></svg>
          <span>Mermaid</span>
        </button>
      </nav>

      <div class="search" id="searchWrap">
        <svg class="search-icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="search" type="search" placeholder="Buscar unidade, setor, diretoria…" autocomplete="off" spellcheck="false" aria-label="Buscar" />
        <kbd>/</kbd>
        <ul class="results" id="results" role="listbox" hidden></ul>
      </div>

      <button class="icon-btn" id="themeBtn" aria-label="Alternar tema" title="Alternar tema">
        <svg class="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg>
      </button>
    </header>

    <!-- ============ SIDEBAR ============ -->
    <aside class="sidebar" id="sidebar">
      <section class="panel">
        <h2 class="panel-title">Visão geral</h2>
        <div class="stats" id="stats"></div>
      </section>

      <section class="panel">
        <h2 class="panel-title">Legenda <span class="panel-hint">passe o mouse para destacar</span></h2>
        <ul class="legend" id="legend"></ul>
      </section>

      <section class="panel grow">
        <details id="editorBox">
          <summary class="panel-title">
            <span>Código Mermaid</span>
            <svg class="chev" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
          </summary>
          <textarea id="editor" spellcheck="false" aria-label="Código Mermaid"></textarea>
          <p class="editor-msg" id="editorMsg"></p>
          <div class="editor-actions">
            <button class="btn primary" id="applyBtn">Renderizar</button>
            <button class="btn" id="copyBtn">Copiar</button>
            <button class="btn ghost" id="resetBtn">Restaurar</button>
          </div>
        </details>
      </section>

      <footer class="shortcuts">
        <span><kbd>/</kbd> buscar</span>
        <span><kbd>F</kbd> ajustar</span>
        <span><kbd>E</kbd> expandir</span>
        <span><kbd>C</kbd> recolher</span>
        <span><kbd>1</kbd>–<kbd>4</kbd> modos</span>
      </footer>
    </aside>
    <div class="scrim" id="scrim"></div>

    <!-- ============ STAGE ============ -->
    <main class="stage" id="stage">
      <svg id="chart" aria-label="Organograma">
        <defs>
          <filter id="shadow" x="-20%" y="-40%" width="140%" height="190%">
            <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0b1626" flood-opacity="0.22"/>
          </filter>
        </defs>
        <g class="viewport">
          <g class="links"></g>
          <g class="nodes"></g>
        </g>
      </svg>

      <div class="mermaid-view" id="mermaidView" hidden>
        <div class="mermaid-inner" id="mermaidInner"></div>
      </div>

      <div class="floating toolbar" id="toolbar">
        <button class="tool" id="expandBtn" title="Expandir tudo (E)">
          <svg viewBox="0 0 24 24"><path d="M7 15l5 5 5-5M7 9l5-5 5 5"/></svg><span>Expandir</span>
        </button>
        <button class="tool" id="collapseBtn" title="Recolher (C)">
          <svg viewBox="0 0 24 24"><path d="M7 20l5-5 5 5M7 4l5 5 5-5"/></svg><span>Recolher</span>
        </button>
        <span class="sep"></span>
        <button class="tool" id="fitBtn" title="Ajustar à tela (F)">
          <svg viewBox="0 0 24 24"><path d="M4 9V5a1 1 0 0 1 1-1h4M15 4h4a1 1 0 0 1 1 1v4M20 15v4a1 1 0 0 1-1 1h-4M9 20H5a1 1 0 0 1-1-1v-4"/></svg><span>Ajustar</span>
        </button>
        <button class="tool" id="exportBtn" title="Exportar SVG">
          <svg viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg><span>SVG</span>
        </button>
      </div>

      <div class="floating zoom" id="zoomCtrl">
        <button class="tool" id="zoomOut" aria-label="Diminuir zoom"><svg viewBox="0 0 24 24"><path d="M6 12h12"/></svg></button>
        <span id="zoomLabel">100%</span>
        <button class="tool" id="zoomIn" aria-label="Aumentar zoom"><svg viewBox="0 0 24 24"><path d="M6 12h12M12 6v12"/></svg></button>
      </div>

      <div class="hint" id="hint">Clique para expandir · Arraste para mover · Role para zoom</div>

      <aside class="detail" id="detail" aria-live="polite"></aside>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.min.js"></script>
  <script src="diagram.js"></script>
  <script src="app.js"></script>
</body>
</html>
